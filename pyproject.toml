[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkaedi"
version = "27.0.0"
description = "Cryptographic Action Receipts & Tamper-Evident Audit Trails for FastAPI & SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ZKAEDI Core Team" }
]
keywords = [
    "audit",
    "compliance",
    "ed25519",
    "cryptography",
    "fastapi",
    "sqlite",
    "tamper-evident",
    "soc2",
    "hipaa",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
]
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.22.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
zkaedi-verify = "src.verify_cli:main"

[project.urls]
Homepage = "https://github.com/invariantzkaedi/zkaedi-authorization-protocol"
Documentation = "https://github.com/invariantzkaedi/zkaedi-authorization-protocol/tree/main/docs"
Repository = "https://github.com/invariantzkaedi/zkaedi-authorization-protocol"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
